<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><h1>📦 Inventory Dashboard</h1></header>
  <main>
    <section class="cards">
      <div class="card"><span>Total Items</span><strong id="statItems">0</strong></div>
      <div class="card"><span>Total Quantity</span><strong id="statQty">0</strong></div>
      <div class="card"><span>Total Value</span><strong id="statValue">0</strong></div>
      <div class="card warn"><span>Low Stock (≤5)</span><strong id="statLow">0</strong></div>
    </section>

    <section class="panel">
      <h2 id="formTitle">Add Item</h2>
      <form id="itemForm">
        <input type="hidden" id="itemId" />
        <input id="name" placeholder="Name" required />
        <input id="category" placeholder="Category" />
        <input id="quantity" type="number" min="0" step="1" placeholder="Quantity" required />
        <input id="price" type="number" min="0" step="0.01" placeholder="Price" required />
        <button type="submit" id="saveBtn">Add</button>
        <button type="button" id="cancelBtn" class="secondary" hidden>Cancel</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>Items</h2>
        <input id="search" placeholder="Search name or category…" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Category</th><th>Qty</th><th>Price</th><th>Actions</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
  </html>
